services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - devopshub-net
    restart: unless-stopped

  app1-collector:
    build: ./app1-collector
    container_name: app1-collector
    ports:
      - "5001:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - devopshub-net
    restart: unless-stopped

  app2-dashboard:
    build: ./app2-dashboard
    container_name: app2-dashboard
    ports:
      - "5002:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - devopshub-net
    restart: unless-stopped

volumes:
  redis-data:

networks:
  devopshub-net:
    driver: bridge