<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOpsHub - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: #1e272e; color: white; }
        h1 { color: #f1c40f; text-align: center; }
        .subtitle { text-align: center; color: #95a5a6; margin-bottom: 35px; }
        .stats { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card { background: #2c3e50; padding: 30px; border-radius: 10px; text-align: center; min-width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .card h2 { margin: 0 0 12px 0; font-size: 16px; color: #bdc3c7; }
        .number { font-size: 56px; font-weight: bold; }
        .messages .number { color: #1abc9c; }
        .visits .number { color: #e67e22; }
        .refresh-note { text-align: center; margin-top: 30px; color: #7f8c8d; font-size: 13px; }
    </style>
</head>
<body>
    <h1>📊 DevOpsHub Dashboard</h1>
    <p class="subtitle">Live stats from Redis</p>
    
    <div class="stats">
        <div class="card messages">
            <h2>Total Messages Collected</h2>
            <div class="number">{{ message_count }}</div>
        </div>
        <div class="card visits">
            <h2>Total Page Visits</h2>
            <div class="number">{{ visit_count }}</div>
        </div>
    </div>
    
    <p class="refresh-note">🔄 Refresh the page to update the data</p>
</body>
</html>
